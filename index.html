<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Local Conditions</title>
<style>
  :root{
    --bg1:#0b1420; --bg2:#0e1a26; --card:#101c29; --card-line:rgba(255,255,255,.06);
    --text:#eef3f8; --muted:#8a97a6; --accent-green:#3ddc84; --accent-amber:#f5a524;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      linear-gradient(160deg, var(--bg1), var(--bg2)),
      repeating-linear-gradient(115deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 60px);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text); padding:24px;
  }
  .wrap{width:min(94vw,460px);}
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)), var(--card);
    border:1px solid var(--card-line); border-radius:22px; padding:22px 20px 16px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
  }
  .top-row{display:flex; justify-content:flex-end; margin-bottom:14px;}
  .aqi-pill{
    display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08); padding:6px 12px; border-radius:999px; font-size:12px;
  }
  .aqi-pill .leaf{color:var(--accent-green); font-size:13px;}
  .aqi-pill .lvl{color:var(--accent-amber); font-weight:600; margin-left:2px;}

  .icon-stage{
    display:flex; align-items:center; justify-content:center; margin:6px 0 14px; height:190px; position:relative;
  }
  .icon-stage svg{max-height:190px; overflow:visible;}

  .label{
    text-align:center; letter-spacing:.14em; font-size:11px; color:var(--muted);
    font-weight:700; text-transform:uppercase; margin-bottom:18px;
  }

  .controls{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:18px;
  }
  .controls button{
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); color:var(--muted);
    padding:7px 12px; border-radius:999px; font-size:11.5px; cursor:pointer; transition:.15s;
  }
  .controls button.active{ background:rgba(255,255,255,.12); color:var(--text); border-color:rgba(255,255,255,.2); }
  .controls button:hover{ color:var(--text); }

  .stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat{
    flex:1 1 130px; background:rgba(255,255,255,.03); border:1px solid var(--card-line);
    border-radius:16px; padding:14px 14px 12px;
  }
  .stat .row{display:flex; justify-content:space-between; align-items:flex-start;}
  .stat .k{font-size:10.5px; letter-spacing:.08em; color:var(--muted); font-weight:700; text-transform:uppercase;}
  .stat .v{font-size:20px; font-weight:700; margin-top:8px;}
  .gauge{width:34px;height:34px;}

  @media (max-width:420px){ .icon-stage{height:150px;} .icon-stage svg{max-height:150px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top-row">
      <div class="aqi-pill"><span class="leaf">🍃</span> AQI 70 · <span class="lvl">Moderate</span></div>
    </div>

    <div class="icon-stage" id="iconStage"></div>
    <div class="label">Local Conditions</div>

    <div class="controls" id="controls"></div>

    <div class="stats">
      <div class="stat">
        <div class="row"><span class="k">UV Index</span><span>❄️</span></div>
        <div class="v">5.7</div>
      </div>
      <div class="stat">
        <div class="row"><span class="k">Pressure</span><span>➤</span></div>
        <div class="v">1010 mb</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------- Condition definitions ---------- */
const CONDITIONS = [
  { id:'clear-day',    label:'Sunny' },
  { id:'clear-night',  label:'Clear Night' },
  { id:'partly-day',   label:'Partly Cloudy' },
  { id:'partly-night', label:'Partly Cloudy Night' },
  { id:'cloudy',       label:'Cloudy' },
  { id:'rain',         label:'Rainy' },
  { id:'thunder',      label:'Thunderstorm' },
  { id:'snow',         label:'Snowy' },
];

/* ---------- SVG builders ---------- */
function svgWrap(inner, vb='0 0 240 190'){
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

function sunGlow(cx=120, cy=95, r=46, id='g1'){
  return `
    <defs>
      <radialGradient id="${id}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffe28a" stop-opacity="0.9"/>
        <stop offset="45%" stop-color="#f5c451" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#f5c451" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="${r*2.1}" fill="url(#${id})"/>
  `;
}
function sunDisc(cx=120, cy=95, r=44){
  return `
    <defs>
      <radialGradient id="sunFace" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#fff6d6"/>
        <stop offset="55%" stop-color="#ffd65c"/>
        <stop offset="100%" stop-color="#f5a623"/>
      </radialGradient>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#sunFace)"/>
  `;
}
function moonGlow(cx=120, cy=95, id='mg1'){
  return `
    <defs>
      <radialGradient id="${id}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#cfe3ff" stop-opacity="0.55"/>
        <stop offset="45%" stop-color="#8fb4ff" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#8fb4ff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="96" fill="url(#${id})"/>
  `;
}
function moonDisc(cx=120, cy=95, r=42){
  // crescent via two circles
  return `
    <defs>
      <radialGradient id="moonFace" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="60%" stop-color="#dbe6f5"/>
        <stop offset="100%" stop-color="#aebedb"/>
      </radialGradient>
      <mask id="moonMask">
        <rect x="0" y="0" width="240" height="190" fill="white"/>
        <circle cx="${cx+18}" cy="${cy-10}" r="${r-2}" fill="black"/>
      </mask>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#moonFace)" mask="url(#moonMask)"/>
  `;
}
function star(x,y,s){
  return `<path d="M${x} ${y-s} L${x+s*0.28} ${y-s*0.28} L${x+s} ${y} L${x+s*0.28} ${y+s*0.28} L${x} ${y+s} L${x-s*0.28} ${y+s*0.28} L${x-s} ${y} L${x-s*0.28} ${y-s*0.28} Z" fill="#dbe6ff" opacity="0.85"/>`;
}
function cloudPath(x=0,y=0,scale=1,fill='#ffffff'){
  return `<g transform="translate(${x},${y}) scale(${scale})">
    <path d="M20 55 C4 55 -6 42 3 29 C6 15 24 6 38 12 C46 -2 70 -3 80 11 C97 9 112 20 111 35 C121 38 122 55 106 55 Z"
      fill="${fill}"/>
  </g>`;
}
function cloudShadow(x=0,y=0,scale=1){
  return cloudPath(x,y,scale,'#c7d2e0');
}
function raindrop(x,y){
  return `<path d="M${x} ${y} c-4 5 -6 9 -6 12 a6 6 0 0 0 12 0 c0 -3 -2 -7 -6 -12z" fill="#5aa7ff"/>`;
}
function snowflake(x,y,s=7,color='#eaf3ff'){
  return `<g transform="translate(${x},${y})" stroke="${color}" stroke-width="1.6" stroke-linecap="round">
    <line x1="0" y1="${-s}" x2="0" y2="${s}"/>
    <line x1="${-s*0.87}" y1="${-s/2}" x2="${s*0.87}" y2="${s/2}"/>
    <line x1="${-s*0.87}" y1="${s/2}" x2="${s*0.87}" y2="${-s/2}"/>
  </g>`;
}
function bolt(x,y){
  return `<path d="M${x} ${y} L${x-10} ${y+22} L${x} ${y+22} L${x-8} ${y+46} L${x+16} ${y+16} L${x+4} ${y+16} Z" fill="#ffd65c"/>`;
}

function buildScene(id){
  switch(id){
    case 'clear-day':
      return svgWrap(sunGlow()+sunDisc());

    case 'clear-night':
      return svgWrap(moonGlow()+star(58,40,4)+star(178,55,3)+star(200,110,4)+star(45,120,3)+moonDisc());

    case 'partly-day':
      return svgWrap(
        sunGlow(150,70,40)+sunDisc(150,70,36)+
        cloudShadow(35,86,1.15)+cloudPath(28,80,1.15)
      );

    case 'partly-night':
      return svgWrap(
        moonGlow(150,68,'mg2')+moonDisc(150,68,34)+
        cloudShadow(35,88,1.15)+cloudPath(28,82,1.15)
      );

    case 'cloudy':
      return svgWrap(
        cloudShadow(20,52,1.15)+cloudPath(14,44,1.15,'#e9edf3')+
        cloudShadow(90,78,1.35)+cloudPath(82,70,1.35,'#ffffff')
      );

    case 'rain':
      return svgWrap(
        cloudShadow(20,42,1.1)+cloudPath(14,34,1.1,'#dfe6ee')+
        cloudShadow(90,66,1.3)+cloudPath(82,58,1.3,'#f4f7fb')+
        raindrop(70,132)+raindrop(105,142)+raindrop(140,130)+raindrop(160,148)
      );

    case 'thunder':
      return svgWrap(
        cloudShadow(20,40,1.1)+cloudPath(14,32,1.1,'#c9d2de')+
        cloudShadow(90,64,1.3)+cloudPath(82,56,1.3,'#dde3ec')+
        bolt(118,120)
      );

    case 'snow':
      return svgWrap(
        cloudShadow(20,44,1.1)+cloudPath(14,36,1.1,'#e5eaf1')+
        cloudShadow(90,68,1.3)+cloudPath(82,60,1.3,'#ffffff')+
        snowflake(72,130,8)+snowflake(110,142,7)+snowflake(148,128,8)+snowflake(168,148,6)
      );

    default:
      return svgWrap(sunGlow()+sunDisc());
  }
}

/* ---------- Render + controls ---------- */
const stage = document.getElementById('iconStage');
const controls = document.getElementById('controls');

function render(id){
  stage.innerHTML = buildScene(id);
  [...controls.children].forEach(b => b.classList.toggle('active', b.dataset.id === id));
}

CONDITIONS.forEach(c => {
  const btn = document.createElement('button');
  btn.textContent = c.label;
  btn.dataset.id = c.id;
  btn.onclick = () => render(c.id);
  controls.appendChild(btn);
});

/* Auto-pick a sensible default based on real local time */
const hour = new Date().getHours();
const isNight = hour < 6 || hour >= 19;
render(isNight ? 'clear-night' : 'clear-day');
</script>
</body>
</html>
